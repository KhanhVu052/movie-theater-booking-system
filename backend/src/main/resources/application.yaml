server:
  port: 8080

spring:
  application:
    name: movie-theater-booking-system

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/cinema_booking_db?useSSL=false&serverTimezone=Asia/Ho_Chi_Minh&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:root}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    baseline-on-migrate: true
    validate-on-migrate: false
    locations: classpath:db/migration

app:
  booking:
    hold-minutes: 10
    expiry-scan-delay-ms: 30000
    expiry-scan-batch-size: 100
    max-pending-per-user: 2
    cutoff-minutes: 15
    refund-cutoff-minutes: 60
    orphan-seat-rule-enabled: true
  showtime:
    cleaning-minutes: 15
  pricing:
    standard-base-price: 60000
    vip-surcharge: 15000
    couple-surcharge: 10000
    weekend-surcharge: 15000
    peak-hour-surcharge: 10000
    morning-discount: 10000
    morning-cutoff-time: "12:00"
    peak-hour-start-time: "18:00"
    peak-hour-end-time: "22:00"
    min-seat-price: 40000
  jwt:
    # Required, no default on purpose. Generate one with: openssl rand -base64 48
    secret: ${JWT_SECRET}
    expiration-ms: 86400000
  bootstrap-admin:
    # Used only when the database has no ADMIN yet. Leave empty to skip.
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}
  dev-tools:
    # Test-only endpoints (payment simulation, fast-forward showtime). Keep false outside local demos.
    enabled: ${DEV_TOOLS_ENABLED:false}
  vnpay:
    tmn-code: ${VNPAY_TMN_CODE:DEMOV210}
    hash-secret: ${VNPAY_HASH_SECRET:RAOEXHYVSDDIIENYWSLDIIZTANXUXZFJ}
    pay-url: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
    return-url: ${VNPAY_RETURN_URL:http://localhost:8080/api/v1/payments/vnpay-return}
    version: 2.1.0
    command: pay
    curr-code: VND
    locale: vn
    order-type: other
